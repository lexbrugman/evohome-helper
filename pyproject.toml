[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13.2,<4.0"
evohome-async = ">=1.0,<2"
aiohttp = "^3.11"
backoff = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.0"
freezegun = "1.5.5"
aioresponses = "^0.7.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
